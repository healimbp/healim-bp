# ══════════════════════════════════════════════════════════════════════════════
# HUGOBLOX CONFIGURATION - 해아림한의원 부평점 통합진료센터
# ══════════════════════════════════════════════════════════════════════════════
hugoblox:
  schema: "2.0"

  # ────────────────────────────────────────────────────────────────────────────
  # IDENTITY
  # ────────────────────────────────────────────────────────────────────────────
  identity:
    name: "해아림한의원 부평점 통합진료센터"
    organization: "해아림한의원 인천부평점"
    type: local_business
    tagline: "부평역 7번 출구 동네 주치의 | 통증·추나·교통사고·호흡기(보폐고)·맞춤보약"
    description: "인천 부평역 7번 출구 위치. 목·허리 디스크, 어깨/무릎 관절 통증, 추나요법, 약침, 교통사고 후유증(자동차보험), 만성 기침·가래·비염·성대결절 호흡기클리닉(보폐고), 맞춤 한약/공진단. 월·수·금 20시 야간진료. 권형근 대표원장 1:1 맞춤 진료."
    social:
      blog: "https://blog.naver.com/s72x6o8cv"
      kakao: "https://pf.kakao.com/_Tcxcxoxj"
      naver_booking: "https://booking.naver.com/booking/13/bizes/934695"

  # ────────────────────────────────────────────────────────────────────────────
  # THEME & COLORS
  # ────────────────────────────────────────────────────────────────────────────
  theme:
    mode: light # light | dark | system
    pack: "default"
    colors:
      primary: "#1B4965"
      secondary: "#EAF4F4"
      neutral: "#F8F9FA"

  # ────────────────────────────────────────────────────────────────────────────
  # TYPOGRAPHY & LAYOUT
  # ────────────────────────────────────────────────────────────────────────────
  typography:
    pack: "system"

  layout:
    radius: "lg"
    spacing: "spacious"
    avatar_shape: rounded

  # ────────────────────────────────────────────────────────────────────────────
  # HEADER
  # ────────────────────────────────────────────────────────────────────────────
  header:
    enable: true
    style: navbar
    sticky: true
    align: center
    search: false
    theme_toggle: false
    cta:
      enable: true
      text: "네이버 예약하기"
      url: "https://booking.naver.com/booking/13/bizes/934695"

  # ────────────────────────────────────────────────────────────────────────────
  # FOOTER
  # ────────────────────────────────────────────────────────────────────────────
  footer:
    style: minimal

  # ────────────────────────────────────────────────────────────────────────────
  # COPYRIGHT & LEGAL
  # ────────────────────────────────────────────────────────────────────────────
  copyright:
    notice: "© {year} 해아림한의원 부평점 통합진료센터. All rights reserved. | 대표원장: 권형근 | 전화: 032-719-3472 | 인천광역시 부평구 경원대로 1412, 2층 (부평역 7번 출구 도보 5분)"

  # ────────────────────────────────────────────────────────────────────────────
  # CONTENT
  # ────────────────────────────────────────────────────────────────────────────
  content:
    math:
      enable: false
    toc:
      enable: true
    reading_time:
      enable: false

  # ────────────────────────────────────────────────────────────────────────────
  # LOCALE
  # ────────────────────────────────────────────────────────────────────────────
  locale:
    date_format: "2006년 01월 02일"
    time_format: "15:04"