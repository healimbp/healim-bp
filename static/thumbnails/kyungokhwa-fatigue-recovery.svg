<svg width="900" height="1020" viewBox="0 0 900 1020" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Dark Navy Card Canvas -->
  <rect x="0" y="0" width="900" height="1020" rx="36" fill="#0d1b2a" />

  <!-- Top Floating Pill (Dark Green + Golden Accent) -->
  <g transform="translate(450, 68)">
    <!-- Pill Base Background -->
    <rect x="-240" y="-24" width="480" height="48" rx="24" fill="#1e3932" />
    <!-- Left Golden Icon Accent Area -->
    <rect x="-236" y="-20" width="200" height="40" rx="20" fill="#c59b27" />
    <!-- Text -->
    <text x="-136" y="6" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle" font-family="'Pretendard', 'Malgun Gothic', sans-serif">
      🌿 맞춤보약
    </text>
    <text x="75" y="6" font-size="16" font-weight="700" fill="#e2f0ea" text-anchor="middle" font-family="'Pretendard', 'Malgun Gothic', sans-serif">
      &amp; 공진단 클리닉
    </text>
  </g>

  <!-- Inner Pure White Card with Drop Shadow -->
  <g filter="url(#cardShadow)">
    <rect x="50" y="115" width="800" height="850" rx="32" fill="#ffffff" />
  </g>

  <!-- Content inside White Card -->
  <!-- 1. Sub-Hook Pill (Light Cream Background + Warm Gold Text) -->
  <g transform="translate(90, 155)">
    <rect x="0" y="0" width="600" height="34" rx="8" fill="#fdf6ec" />
    <text x="14" y="23" font-size="15" font-weight="800" fill="#b88a3b" font-family="'Pretendard', 'Malgun Gothic', sans-serif">
      기력 저하, 면역력 결핍, 수술 후 회복기 보약
    </text>
  </g>

  <!-- 2. Main Title (Crisp, High-Impact Typography) -->
  <g transform="translate(90, 235)">
    <text font-size="34" font-weight="900" fill="#0f172a" font-family="'Pretendard', 'Malgun Gothic', sans-serif">
      전통 원방경옥고 · 72시간 옹기 중탕
    </text>
  </g>

  <!-- 3. Doctor & Clinic Strip (Light Cool Grey Background) -->
  <g transform="translate(90, 268)">
    <rect x="0" y="0" width="720" height="48" rx="12" fill="#f1f5f9" />
    <text x="20" y="30" font-size="15" font-weight="700" fill="#475569" font-family="'Pretendard', 'Malgun Gothic', sans-serif">
      해아림한의원 부평점 · <tspan fill="#1e3932" font-weight="800">권형근 대표원장 (한방침구과 전문의 1:1 직접 진료)</tspan>
    </text>
  </g>

  <!-- 4. Step 01 Card -->
  <g transform="translate(90, 340)">
    <rect x="0" y="0" width="720" height="120" rx="18" fill="#fcfbf9" stroke="#eef2f5" stroke-width="1.5" />
    <!-- Gold Number Badge -->
    <rect x="18" y="18" width="62" height="84" rx="14" fill="#c59b27" />
    <text x="49" y="68" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle" font-family="'Pretendard', 'Malgun Gothic', sans-serif">01</text>
    <!-- Card Text -->
    <text x="102" y="50" font-size="20" font-weight="800" fill="#0f172a" font-family="'Pretendard', 'Malgun Gothic', sans-serif">
      6년근 생지황·인삼·복령·꿀의 황금 배합
    </text>
    <text x="102" y="82" font-size="14.5" font-weight="500" fill="#64748b" font-family="'Pretendard', 'Malgun Gothic', sans-serif">
      동의보감 전통 제법 3일 주야 옹기 숙성
    </text>
  </g>

  <!-- 5. Step 02 Card -->
  <g transform="translate(90, 480)">
    <rect x="0" y="0" width="720" height="120" rx="18" fill="#fcfbf9" stroke="#eef2f5" stroke-width="1.5" />
    <!-- Gold Number Badge -->
    <rect x="18" y="18" width="62" height="84" rx="14" fill="#c59b27" />
    <text x="49" y="68" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle" font-family="'Pretendard', 'Malgun Gothic', sans-serif">02</text>
    <!-- Card Text -->
    <text x="102" y="50" font-size="20" font-weight="800" fill="#0f172a" font-family="'Pretendard', 'Malgun Gothic', sans-serif">
      폐음(肺陰) 보충 &amp; 조혈 기능 촉진
    </text>
    <text x="102" y="82" font-size="14.5" font-weight="500" fill="#64748b" font-family="'Pretendard', 'Malgun Gothic', sans-serif">
      만성 소모성 질환 및 마른기침, 피로 회복
    </text>
  </g>

  <!-- 6. Step 03 Card -->
  <g transform="translate(90, 620)">
    <rect x="0" y="0" width="720" height="120" rx="18" fill="#fcfbf9" stroke="#eef2f5" stroke-width="1.5" />
    <!-- Gold Number Badge -->
    <rect x="18" y="18" width="62" height="84" rx="14" fill="#c59b27" />
    <text x="49" y="68" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle" font-family="'Pretendard', 'Malgun Gothic', sans-serif">03</text>
    <!-- Card Text -->
    <text x="102" y="50" font-size="20" font-weight="800" fill="#0f172a" font-family="'Pretendard', 'Malgun Gothic', sans-serif">
      온 가족 면역력 증진 &amp; 항산화 효능
    </text>
    <text x="102" y="82" font-size="14.5" font-weight="500" fill="#64748b" font-family="'Pretendard', 'Malgun Gothic', sans-serif">
      남녀노소 부담 없이 복용하는 순수 보약
    </text>
  </g>

  <!-- 7. Bottom Dark Green Footer Bar -->
  <g transform="translate(90, 765)">
    <rect x="0" y="0" width="720" height="52" rx="14" fill="#1e3932" />
    <text x="360" y="32" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="'Pretendard', 'Malgun Gothic', sans-serif">
      📍 인천 부평역 7번 출구 | 야간진료 (월·수·금 20시) | 📞 032-719-3472
    </text>
  </g>
</svg>