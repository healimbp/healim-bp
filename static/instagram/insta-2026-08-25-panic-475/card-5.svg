            <text x="0" y="65" font-size="21" font-weight="600" fill="#f1f5f9" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans CJK KR', 'Noto Sans KR', sans-serif">인천광역시 부평구 부평대로 24 (부평역 5번 출구 인근)</text>
