            <text x="72" y="22" font-size="16" font-weight="700" fill="#38bdf8" text-anchor="middle" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans CJK KR', 'Noto Sans KR', sans-serif">예약 및 상담 문의</text>
