        <stop offset="0%" stop-color="#05101d" />
        <stop offset="50%" stop-color="#0b1e36" />
        <stop offset="100%" stop-color="#040b14" />
      </linearGradient>
      <filter id="blurEffect" x="-50%" y="-50%" width="200%" height="200%">
